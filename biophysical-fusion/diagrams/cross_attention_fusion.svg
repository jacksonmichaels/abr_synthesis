<text x="34" y="46" font-size="24" font-weight="700" fill="#1f2933">Cross-Attention Fusion CNN  (asymmetric: DNA = Query, biophysical = Key/Value)</text>
<text x="34" y="72" font-size="13.5" fill="#52606d">Representative scenario — Rifampicin (loci rpoB + rpoC):  DNA one-hot 5x240,  biophysical 3 channels,  protein lengths K = 78 / 66</text>
