<text x="230" y="233.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">DNA encoder</text>
<text x="230" y="251.0" font-size="11" fill="#eef2f6" text-anchor="middle">trained on sequences</text>
