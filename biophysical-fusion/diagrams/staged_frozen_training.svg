<text x="230" y="363.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Protein encoder</text>
<text x="230" y="381.0" font-size="11" fill="#eef2f6" text-anchor="middle">trained on sequences</text>
<rect x="285.6" y="319" width="75.4" height="21" rx="10.5" fill="#2f8f4e" stroke="#ffffff" stroke-width="1.4"/>
<text x="323.3" y="333.5" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">trainable</text>
<text x="230" y="470" font-size="11.5" fill="#52606d" text-anchor="middle">each learns its own sequence representation</text>
<rect x="460" y="108" width="380" height="440" rx="14" fill="#ffffff" stroke="#5b6670" stroke-width="1.4" stroke-opacity="0.5"/>
