<rect x="725.4" y="319" width="55.599999999999994" height="21" rx="10.5" fill="#5b6670" stroke="#ffffff" stroke-width="1.4"/>
<text x="753.1999999999999" y="333.5" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">frozen</text>
<text x="650" y="470" font-size="11.5" fill="#52606d" text-anchor="middle">latents reused, no longer updated</text>
