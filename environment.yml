# Everything the code imports, pinned to the versions in the lab's abr_env.
#   conda env create -f environment.yml
# The promoter MSA extractor (msa/make_aligned_msa.py) needs PyVCF and runs in
# Sai's separate `make_msa` env (project_data_curation/make_msa/envs).
name: abr_env
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - numpy==2.4.6
      - pandas==3.0.3
      - scipy==1.18.0
      - scikit-learn==1.9.0
      - biopython==1.87
      - matplotlib==3.11.1
      - requests==2.34.2
